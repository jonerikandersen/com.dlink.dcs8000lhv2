<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <!-- D-Link camera app icon: stylized PTZ camera -->
  <circle cx="128" cy="128" r="124" fill="#1e5aa0"/>

  <!-- Camera body -->
  <g fill="#ffffff">
    <!-- Lens housing (sphere) -->
    <circle cx="128" cy="128" r="60" fill="#ffffff" opacity="0.95"/>
    <circle cx="128" cy="128" r="44" fill="#1e5aa0"/>
    <!-- Inner lens -->
    <circle cx="128" cy="128" r="28" fill="#0a2c52"/>
    <circle cx="128" cy="128" r="20" fill="#1e5aa0"/>
    <!-- Highlight -->
    <circle cx="116" cy="116" r="6" fill="#ffffff" opacity="0.7"/>
    <!-- Status LED -->
    <circle cx="128" cy="80" r="4" fill="#ff5454"/>
  </g>

  <!-- Stand -->
  <g fill="#ffffff" opacity="0.85">
    <rect x="106" y="186" width="44" height="14" rx="2"/>
    <rect x="120" y="180" width="16" height="10"/>
  </g>
</svg>
