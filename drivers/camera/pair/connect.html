<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<style>
		body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; padding: 1rem 1.25rem; color: #222; line-height: 1.45; }
		h2 { margin: 0 0 0.5rem; }
		.lede { color: #555; font-size: 0.9rem; margin: 0 0 1.5rem; }
		label { display: block; margin: 1.25rem 0 0.35rem; font-size: 0.88rem; color: #555; font-weight: 500; }
		input, select {
			padding: 0.75rem 0.85rem; font-size: 1.05rem;
			border: 1px solid #ccc; border-radius: 10px; box-sizing: border-box;
			background: white; font-family: inherit;
		}
		input:focus, select:focus { outline: none; border-color: #1e5aa0; box-shadow: 0 0 0 3px rgba(30, 90, 160, 0.15); }
		select, #pin { width: 100%; }
		.hint { font-size: 0.78rem; color: #999; margin-top: 0.3rem; }

		.ip-row { display: flex; align-items: center; gap: 0.4rem; }
		.ip-row .oct {
			width: 100%; min-width: 0; flex: 1 1 0;
			text-align: center; font-variant-numeric: tabular-nums;
			letter-spacing: 0.06em; font-size: 1.1rem;
		}
		.ip-row .dot { color: #999; font-weight: 700; font-size: 1.2rem; user-select: none; }

		button {
			margin-top: 1.75rem; width: 100%; padding: 0.9rem; font-size: 1rem;
			border: 0; border-radius: 10px; background: #1e5aa0; color: white;
			cursor: pointer; font-weight: 600;
		}
		button:hover { background: #18497f; }
		button:disabled { background: #aaa; cursor: wait; }
		.error { color: #c33; margin-top: 1rem; font-size: 0.88rem; padding: 0.7rem 0.85rem; background: #fee; border-radius: 8px; border: 1px solid #fcc; }
		.ok { color: #1a5e36; margin-top: 1rem; font-size: 0.88rem; padding: 0.7rem 0.85rem; background: #f0faf3; border-radius: 8px; border: 1px solid #b8e1c6; }
	</style>
</head>
<body>

	<h2>Connect your D-Link camera</h2>
	<p class="lede">
		Two things: the camera's IP address on your network, and the PIN printed on the camera's label.
	</p>

	<label>IP address</label>
	<div class="ip-row" id="ip-row">
		<input type="text" class="oct" data-i="0" maxlength="3" inputmode="numeric" autocomplete="off" placeholder="192">
		<span class="dot">.</span>
		<input type="text" class="oct" data-i="1" maxlength="3" inputmode="numeric" autocomplete="off" placeholder="168">
		<span class="dot">.</span>
		<input type="text" class="oct" data-i="2" maxlength="3" inputmode="numeric" autocomplete="off" placeholder="1">
		<span class="dot">.</span>
		<input type="text" class="oct" data-i="3" maxlength="3" inputmode="numeric" autocomplete="off" placeholder="50">
	</div>
	<div class="hint">Tip: paste the full IP into the first field — it splits automatically.</div>

	<label for="pin">PIN</label>
	<input type="text" id="pin" placeholder="123456" autocomplete="off" inputmode="numeric">
	<div class="hint">The 6-digit PIN on the camera, also shown in the mydlink app.</div>

	<label for="profile">Stream quality</label>
	<select id="profile">
		<option value="profile.0">1080p (best)</option>
		<option value="profile.1">720p (lower bandwidth)</option>
	</select>

	<button id="go">Connect</button>

	<div id="status"></div>

	<script type="application/javascript">
		const octs = Array.from(document.querySelectorAll('.oct'));
		const pinEl = document.getElementById('pin');
		const profileEl = document.getElementById('profile');
		const go = document.getElementById('go');
		const status = document.getElementById('status');

		function readIp() {
			return octs.map(o => o.value.trim()).join('.');
		}
		function ipValid() {
			return octs.every(o => {
				const v = o.value.trim();
				if (!/^\d{1,3}$/.test(v)) return false;
				const n = parseInt(v, 10);
				return n >= 0 && n <= 255;
			});
		}
		function focusNext(idx) {
			if (idx + 1 < octs.length) {
				octs[idx + 1].focus();
				octs[idx + 1].select();
			} else {
				pinEl.focus();
			}
		}
		function focusPrev(idx) {
			if (idx - 1 >= 0) {
				const prev = octs[idx - 1];
				prev.focus();
				// Move cursor to end
				const v = prev.value;
				prev.setSelectionRange(v.length, v.length);
			}
		}

		octs.forEach((el, idx) => {
			el.addEventListener('input', (e) => {
				// Strip non-digits live
				const cleaned = el.value.replace(/\D/g, '').slice(0, 3);
				if (cleaned !== el.value) el.value = cleaned;
				// Auto-advance on 3 digits, or when value >= 26 (only 1 more digit possible)
				if (cleaned.length === 3) focusNext(idx);
				else if (cleaned.length === 2 && parseInt(cleaned, 10) > 25) focusNext(idx);
			});
			el.addEventListener('keydown', (e) => {
				if (e.key === '.' || e.key === ',' || e.key === 'Tab' && !e.shiftKey) {
					if (e.key !== 'Tab') e.preventDefault();
					if (el.value.length > 0) focusNext(idx);
				} else if (e.key === 'Backspace' && el.value === '' && idx > 0) {
					e.preventDefault();
					focusPrev(idx);
				} else if (e.key === 'ArrowLeft' && el.selectionStart === 0) {
					e.preventDefault();
					focusPrev(idx);
				} else if (e.key === 'ArrowRight' && el.selectionStart === el.value.length) {
					if (idx + 1 < octs.length) {
						e.preventDefault();
						octs[idx + 1].focus();
						octs[idx + 1].setSelectionRange(0, 0);
					}
				}
			});
			el.addEventListener('paste', (e) => {
				const text = (e.clipboardData || window.clipboardData).getData('text');
				if (text && text.indexOf('.') !== -1) {
					e.preventDefault();
					const parts = text.replace(/[^\d.]/g, '').split('.').slice(0, 4);
					parts.forEach((p, i) => {
						if (octs[i]) octs[i].value = p.slice(0, 3);
					});
					// Focus last filled or first empty
					const lastFilled = octs.findIndex(o => !o.value);
					if (lastFilled === -1) pinEl.focus();
					else octs[lastFilled].focus();
				}
			});
		});

		octs[0].focus();

		async function submit() {
			const ip = readIp();
			const pin = pinEl.value.trim();
			const profile = profileEl.value;
			status.textContent = '';
			status.className = '';

			if (!ipValid()) { status.textContent = 'Enter a valid IP address (e.g. 192.168.1.50).'; status.className = 'error'; return; }
			if (!pin)       { status.textContent = 'PIN is required.';                              status.className = 'error'; return; }

			go.disabled = true;
			go.textContent = 'Connecting…';
			try {
				const result = await Homey.emit('test', { ip, user: 'admin', pwd: pin, profile });
				status.textContent = 'Snapshot received (' + Math.round(result.snapshotBytes / 1024) + ' KB). Loading preview…';
				status.className = 'ok';
				await Homey.nextView();
			} catch (err) {
				status.textContent = (err && err.message) || String(err);
				status.className = 'error';
				go.disabled = false;
				go.textContent = 'Connect';
			}
		}

		go.addEventListener('click', submit);
		pinEl.addEventListener('keydown', (e) => { if (e.key === 'Enter') submit(); });
	</script>
</body>
</html>
