<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<style>
		body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; padding: 1rem 1.25rem; color: #222; line-height: 1.45; text-align: center; }
		h2 { margin: 0 0 0.5rem; }
		.lede { color: #555; font-size: 0.9rem; margin: 0 0 1rem; }
		.frame { background: #111; border-radius: 12px; overflow: hidden; aspect-ratio: 16/9; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 14px rgba(0,0,0,0.12); margin: 0 0 1rem; }
		.frame img { max-width: 100%; max-height: 100%; }
		.frame .placeholder { color: #888; font-size: 0.9rem; }
		.meta { color: #888; font-size: 0.8rem; margin: 0 0 1.25rem; }
		button { width: 100%; padding: 0.85rem; font-size: 1rem; border: 0; border-radius: 8px; background: #1e5aa0; color: white; cursor: pointer; font-weight: 600; }
		button:hover { background: #18497f; }
		.back { background: #eee; color: #333; margin-top: 0.5rem; }
		.back:hover { background: #ddd; }
	</style>
</head>
<body>

	<h2>Looks good?</h2>
	<p class="lede">This is what your camera sees right now.</p>

	<div class="frame">
		<div class="placeholder">Loading snapshot…</div>
	</div>

	<div class="meta" id="meta"></div>

	<button id="go">Yes, add this camera</button>
	<button class="back" id="back">Try a different IP/password</button>

	<script type="application/javascript">
		const frame = document.querySelector('.frame');
		const meta = document.getElementById('meta');

		(async () => {
			try {
				const data = await Homey.emit('preview');
				if (data && data.snapshotBase64) {
					frame.innerHTML = '<img src="data:image/jpeg;base64,' + data.snapshotBase64 + '" alt="snapshot">';
					meta.textContent = 'Snapshot from ' + (data.ip || 'camera');
				} else {
					frame.innerHTML = '<div class="placeholder">No snapshot data — go back and try again.</div>';
				}
			} catch (e) {
				frame.innerHTML = '<div class="placeholder">' + ((e && e.message) || e) + '</div>';
			}
		})();

		document.getElementById('go').addEventListener('click', () => Homey.nextView());
		document.getElementById('back').addEventListener('click', () => Homey.showView('connect'));
	</script>
</body>
</html>
